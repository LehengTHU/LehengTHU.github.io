{% include base_path %}<a class="org" href="{{ include.url }}">{% if include.logo %}<img class="org-logo{% if include.wordmark %} org-logo--wordmark{% endif %}{% if include.logo_size %} org-logo--{{ include.logo_size }}{% endif %}" src="{{ base_path }}{{ include.logo }}" alt="" width="{{ include.w | default: 96 }}" height="{{ include.h | default: 96 }}">{% endif %}<span>{{ include.name }}</span></a>
